ام: اتخذوا مواقع الطوارئ. أكدوا وصولكم.»"}, {"sid": "ssp122-S441", "en": "Wait. It's only 'get ready'.", "ar": "انتظروا. إنها فقط «استعدّوا»."}, {"sid": "ssp122-S442", "en": "\"All call: open every exit gate.\"", "ar": "«نداء عام: افتحوا كل بوابات الخروج.»"}], "answer": 1, "why": {"sid": "ssp122-S443", "en": "Positions, check, report ready. Nothing to fans.", "ar": "المواقع، التحقق، الإبلاغ بالجاهزية. لا شيء للمشجعين."}}, {"scene": {"sid": "ssp122-S444", "en": "Radio: \"All marshals at C gates, open exit gates now.\"", "ar": "اللاسلكي: «كل المنظِّمين عند بوابات C، افتحوا بوابات الخروج الآن.»"}, "choices": [{"sid": "ssp122-S445", "en": "\"Wait until the fans start to move.\"", "ar": "«انتظروا حتى يبدأ المشجعون بالتحرك.»"}, {"sid": "ssp122-S446", "en": "\"C gate marshals: open them halfway only, so fans don't rush out all at once.\"", "ar": "«منظِّمو بوابات C: افتحوها إلى النصف فقط، حتى لا يندفع المشجعون كلهم مرة واحدة.»"}, {"sid": "ssp122-S447", "en": "\"C gate marshals: open fully, stand aside, no entry. Confirm when open.\"", "ar": "«منظِّمو بوابات C: افتحوها بالكامل، وابتعدوا جانبًا، ولا دخول. أكدوا عند الفتح.»"}, {"sid": "ssp122-S448", "en": "Open them yourself, one by one.", "ar": "افتحوها بأنفسكم، واحدة تلو الأخرى."}], "answer": 2, "why": {"sid": "ssp122-S449", "en": "That is your instruction to open.", "ar": "هذه تعليماتكم بالفتح."}}, {"scene": {"sid": "ssp122-S450", "en": "The evacuation announcement on the PA and screens, for Block C.", "ar": "إعلان الإخلاء عبر مكبرات الصوت والشاشات، للمبنى C."}, "choices": [{"sid": "ssp122-S451", "en": "\"All call: hurry everyone out.\"", "ar": "«نداء عام: أخرجوا الجميع بسرعة.»"}, {"sid": "ssp122-S452", "en": "\"All call: everyone stay where you are. Nobody moves a fan until I give the word.\"", "ar": "«نداء عام: ابقوا جميعًا في أماكنكم. لا أحد يحرّك مشجعًا حتى أقول.»"}, {"sid": "ssp122-S453", "en": "Send the sweepers home first.", "ar": "اصرفوا منظِّمي التمشيط أولًا."}, {"sid": "ssp122-S454", "en": "Stair heads hold the pace. Sweepers go. Help to the refuge point. You watch.", "ar": "مداخل السلالم تضبط الوتيرة. التمشيط يبدأ. المساعدة إلى نقطة اللجوء. وأنتم تراقبون."}], "answer": 3, "why": {"sid": "ssp122-S455", "en": "Evacuation means go. Your team runs the plan.", "ar": "الإخلاء يعني: تحرّكوا. فريقكم ينفّذ الخطة."}}, {"scene": {"sid": "ssp122-S456", "en": "Every phone in the stand sounds a public alert.", "ar": "كل هاتف في المدرج يُصدر تنبيه الطوارئ العام."}, "choices": [{"sid": "ssp122-S457", "en": "\"All call: stay at your posts, keep fans calm, wait for the instruction.\"", "ar": "«نداء عام: ابقوا في مواقعكم، وأبقوا المشجعين هادئين، وانتظروا التعليمات.»"}, {"sid": "ssp122-S458", "en": "\"All call: send fans out to the car parks, away from the stadium building.\"", "ar": "«نداء عام: أرسلوا المشجعين إلى مواقف السيارات، بعيدًا عن مبنى الملعب.»"}, {"sid": "ssp122-S459", "en": "\"All call: tell fans to go home.\"", "ar": "«نداء عام: اصرفوا المشجعين لبيوتهم.»"}, {"sid": "ssp122-S460", "en": "Say nothing until it stops.", "ar": "لا تقولوا شيئًا حتى يتوقف."}], "answer": 0, "why": {"sid": "ssp122-S461", "en": "Don't send fans outside. Follow the shelter instruction when it comes.", "ar": "لا ترسلوا المشجعين إلى الخارج. اتبعوا تعليمات الاحتماء عندما تصل."}}, {"scene": {"sid": "ssp122-S462", "en": "The all-clear message.", "ar": "رسالة انتهاء الخطر."}, "choices": [{"sid": "ssp122-S463", "en": "\"All call: the danger is over. Back to your posts now, and open the gates again.\"", "ar": "«نداء عام: انتهى الخطر. عودوا إلى مواقعكم الآن، وافتحوا البوابات مرة أخرى.»"}, {"sid": "ssp122-S464", "en": "\"All call: hold your positions. Back to posts only on the return instruction.\"", "ar": "«نداء عام: ابقوا في مواقعكم. العودة إلى المواقع فقط بتعليمات العودة.»"}, {"sid": "ssp122-S465", "en": "\"All call: you can go home.\"", "ar": "«نداء عام: انصرفوا إلى بيوتكم.»"}, {"sid": "ssp122-S466", "en": "Reopen everything yourself.", "ar": "أعيدوا فتح كل شيء بأنفسكم."}], "answer": 1, "why": {"sid": "ssp122-S467", "en": "The all-clear isn't a return instruction. Then count your team again.", "ar": "رسالة انتهاء الخطر ليست تعليمات عودة. ثم أحصوا فريقكم مرة أخرى."}}], "wrongWhy": {"sid": "ssp122-S468", "en": "Not that one. What does this message mean for your team?", "ar": "ليس هذا. ماذا تعني هذه الرسالة لفريقكم؟"}, "feedbackCorrect": {"sid": "ssp122-S469", "en": "Six messages, six clear instructions to your team.", "ar": "ست رسائل، وست تعليمات واضحة لفريقكم."}, "x_mistakes": ["M1", "M2", "M4", "M9", "M11", "M16", "M18"], "safetyCritical": false, "xp": {"complete": 5, "firstTimeCorrect": 10}, "a11y": {"alternative": "Every choice is a labelled button; screen readers read the text.", "state": "Right and wrong are shown with a tick or a cross and words, never colour alone."}, "src": "〔L12.2 §5.2〕 the six messages, best instructions and feedback (code words never shown: 'the stand-by message', SSP122-P1); the 18 wrong choices are ours, from the mistake bank 〔SSP122-P19〕"}, {"id": "5.2", "section": "5", "lo": [3], "type": "sort", "x_mechanic": "deck", "bloom": "apply", "kicker": {"sid": "ssp122-S470", "en": "Try it", "ar": "جرّبوا"}, "heading": {"sid": "ssp122-S471", "en": "Head count", "ar": "عَدّ الفريق"}, "task": {"sid": "ssp122-S472", "en": "After the evacuation, you count your fifteen marshals against your list. Ten are already ticked at assembly. Put each card in the right box.", "ar": "بعد الإخلاء، تعدّون منظِّميكم الخمسة عشر مقابل قائمتكم. عشرة عليهم علامة في نقطة التجمع. ضعوا كل بطاقة في الصندوق الصحيح."}, "columns": [{"sid": "ssp122-S473", "en": "At assembly", "ar": "عند التجمع"}, {"sid": "ssp122-S474", "en": "Confirmed elsewhere", "ar": "مؤكد في مكان آخر"}, {"sid": "ssp122-S475", "en": "Not confirmed", "ar": "غير مؤكد"}], "cards": [{"text": {"sid": "ssp122-S476", "en": "Faisal answers in person.", "ar": "فيصل يرد بنفسه."}, "column": 0, "why": {"sid": "ssp122-S477", "en": "You see him. Tick his name.", "ar": "ترونه. ضعوا علامة على اسمه."}}, {"text": {"sid": "ssp122-S478", "en": "Marshal 21 answers in person.", "ar": "المنظِّم 21 يرد بنفسه."}, "column": 0, "why": {"sid": "ssp122-S479", "en": "You see him. Tick his name.", "ar": "ترونه. ضعوا علامة على اسمه."}}, {"text": {"sid": "ssp122-S480", "en": "Reem radios from the refuge point, with a fan.", "ar": "ريم تتصل لاسلكيًا من نقطة اللجوء، مع مشجع."}, "column": 1, "why": {"sid": "ssp122-S481", "en": "She told you where she is. Never count her twice.", "ar": "أخبرتكم أين هي. لا تعدّوها مرتين أبدًا."}}, {"text": {"sid": "ssp122-S482", "en": "Marshal 33 answers in person.", "ar": "المنظِّم 33 يرد بنفسه."}, "column": 0, "why": {"sid": "ssp122-S483", "en": "You see him. Tick his name.", "ar": "ترونه. ضعوا علامة على اسمه."}}, {"text": {"sid": "ssp122-S484", "en": "Marshal 26: \"I think Marshal 28 went out another way.\"", "ar": "المنظِّم 26: «أظن أن المنظِّم 28 خرج من طريق آخر.»"}, "column": 2, "why": {"sid": "ssp122-S485", "en": "A guess is not confirmed. Marshal 28 is still not confirmed.", "ar": "التخمين ليس تأكيدًا. المنظِّم 28 ما زال غير مؤكد."}}, {"text": {"sid": "ssp122-S486", "en": "Marshal 28: radio silent. Last seen at the men's prayer room.", "ar": "المنظِّم 28: اللاسلكي صامت. شوهد آخر مرة في مصلى الرجال."}, "column": 2, "why": {"sid": "ssp122-S487", "en": "Not seen, not heard. Not confirmed.", "ar": "لم يُرَ، ولم يُسمع. غير مؤكد."}}], "media": ["ssp122-s3-list"], "x_hint": {"sid": "ssp122-S488", "en": "Did you see them, or did they tell you where they are?", "ar": "هل رأيتموهم، أم أخبروكم أين هم؟"}, "x_mistakes": ["M14", "M15"], "safetyCritical": false, "xp": {"complete": 5, "firstTimeCorrect": 10}, "a11y": {"alternative": "Tap a card, then tap a box button; keyboard works too.", "state": "Each card shows a tick or a cross and words, never colour alone."}, "src": "〔L12.2 §5.3 (HN)〕 13 at assembly, Marshal 30 confirmed at the refuge point, Marshal 28 not confirmed - sweeper, prayer room ('the men's prayer room', intake Q5); 'confirmed elsewhere, not missing' and 'a guess is not confirmed' from HN's four-status idea and DP5 C 〔intake Q9〕"}, {"id": "5.3", "section": "5", "lo": [3], "type": "mcq", "x_mechanic": "doors", "bloom": "apply", "kicker": {"sid": "ssp122-S489", "en": "What now?", "ar": "ماذا الآن؟"}, "task": {"sid": "ssp122-S490", "en": "Marshal 28 is not confirmed. His radio is silent. What do you do?", "ar": "المنظِّم 28 غير مؤكد. اللاسلكي صامت. ماذا تفعلون؟"}, "options": [{"text": {"sid": "ssp122-S491", "en": "Go back in to the prayer room yourself, quickly", "ar": "ادخلوا بأنفسكم إلى المصلى، بسرعة"}, "score": 0, "feedback": {"sid": "ssp122-S492", "en": "Unsafe. Nobody goes back in. Not even you.", "ar": "خطر. لا أحد يعود إلى الداخل. ولا حتى أنتم."}, "x_trap": "mistake", "x_breaks": "M13"}, {"text": {"sid": "ssp122-S493", "en": "Report him now: name, task, last place", "ar": "أبلغوا عنه الآن: الاسم، والمهمة، وآخر مكان"}, "score": 2, "feedback": {"sid": "ssp122-S494", "en": "Civil Defence can search with exact information. Try his radio, and keep the team together.", "ar": "الدفاع المدني يستطيع البحث بمعلومات دقيقة. جرّبوا لاسلكي المنظِّم، وأبقوا الفريق معًا."}}, {"text": {"sid": "ssp122-S495", "en": "Wait ten minutes, in case he turns up soon", "ar": "انتظروا عشر دقائق، لعله يظهر قريبًا"}, "score": 0, "feedback": {"sid": "ssp122-S496", "en": "Minutes matter. Report now.", "ar": "الدقائق مهمة. أبلغوا الآن."}, "x_trap": "polite", "x_breaks": "M14"}, {"text": {"sid": "ssp122-S497", "en": "Send Faisal back in to look for him, carefully", "ar": "أرسلوا فيصل إلى الداخل ليبحث عنه، بحذر"}, "score": 0, "feedback": {"sid": "ssp122-S498", "en": "Unsafe. Nobody goes back in to look.", "ar": "خطر. لا أحد يعود إلى الداخل ليبحث."}, "x_trap": "polite", "x_breaks": "M13"}], "safetyCritical": true, "xp": {"complete": 5, "firstTimeCorrect": 10}, "a11y": {"alternative": "Every choice is a labelled button; screen readers read the text.", "state": "Right and wrong are shown with a tick or a cross and words, never colour alone."}, "src": "〔L12.2 §5.3〕 o ِّم 28 على الأرجح في المصلى.»"}, "belongs": false, "consequence": {"sid": "ssp122-S510", "en": "A guess. Say 'not confirmed', and where he was last.", "ar": "تخمين. قولوا «غير مؤكد»، وآخر مكان كان فيه."}}, {"text": {"sid": "ssp122-S511", "en": "\"Wheelchair user and his daughter with Marshal 30 at the refuge point. The assisted-evacuation team are not here yet.\"", "ar": "«مستخدم كرسي متحرك وابنته مع المنظِّمة 30 عند نقطة اللجوء. فريق الإخلاء المساند لم يصل بعد.»"}, "belongs": true}, {"text": {"sid": "ssp122-S512", "en": "\"Toilets and prayer room checked clear.\"", "ar": "«دورات المياه والمصلى خالية بعد التفقد.»"}, "belongs": false, "consequence": {"sid": "ssp122-S513", "en": "The prayer room is not confirmed. Never say 'clear' with a check missing.", "ar": "المصلى غير مؤكد. لا تقولوا «خالٍ» أبدًا وهناك تفقد ناقص."}}, {"text": {"sid": "ssp122-S514", "en": "\"Gate C3 was padlocked. Reported.\"", "ar": "«البوابة C3 كانت مقفلة. تم الإبلاغ.»"}, "belongs": true}, {"text": {"sid": "ssp122-S515", "en": "\"Over.\"", "ar": "«حوّل.»"}, "belongs": true}], "x_feedbackCorrect": {"sid": "ssp122-S516", "en": "Each status once. What is not confirmed. Who is still being helped. The problem. Facts only.", "ar": "كل حالة مرة واحدة. ما هو غير مؤكد. من ما زال يتلقى المساعدة. المشكلة. الحقائق فقط."}, "x_mistakes": {"opinion": "M15"}, "safetyCritical": false, "xp": {"complete": 5, "firstTimeCorrect": 10}, "a11y": {"alternative": "Each line has two labelled buttons (Keep / Leave out); keyboard works too.", "state": "Each line shows a tick or a cross and words, never colour alone."}, "src": "〔L12.2 §5.4 (HN)〕 the six chips in order, their wording and the three distractors; 'prayer room' → 'men's prayer room' 〔intake Q5〕; 'refuge point C upper' → 'the refuge point' (P4) · review 24 Nov 2026 (Bradley): three plausible wrong lines (all clear with a check missing; a guess; the prayer room called clear)"}, {"id": "5.5", "section": "5", "lo": [4], "type": "sort", "x_mechanic": "belt", "bloom": " /* ============ SCRIPT MECHANICS (part 6): many ways to play the same activity ============

     mcq         list (option list) · tiles (2×2 picture-style tiles) · doors (side-by-side choices, ≤3 options)
                 · chat (reply bubbles; only when every option is something you say, in quotes)
     order       list (▲▼) · stack (tap the next step; cards pile up in order) · path (steps placed on a route)
     trueFalse   card (two buttons + swipe; the default, no rotation) · stamp (stamp on a paper) · thumbs (👍 / 👎 mark) — all with the same ✓ True / ✕ False buttons
     revealCards scene (glass cards over a scene, picture fixed, panel turns left-right; explicit only — script-types.js sceneCards)

    (ok&&SHARED?'':'<button type="button" class="rv-del" data-id="'+esc(c.id)+'">Delete</button>')+'</li>';}).join('');
  var n=all().length;
  g('rvAll').textContent=SHARED?(n===1?'1 open comment on this course.':n+' open comments on this course.'):(n===1?'1 comment saved in this course.':n+' comments saved in this course.');
  g('rvHint').textContent=SHARED?(net==='down'?'Cannot reach the comment sheet. Your comments are kept here and sent when the connection is back.':
      'Everyone reviewing this course sees these comments. The course team removes a comment when it is fixed.'):
    (mem?'This browser cannot keep comments. Download them before you close the page.':
      'Comments stay in this browser. When you finish, tap "Download all comments" and send the file back.');
  g('rvDown').disabled=!n;if(g('rvClear'))g('rvClear').disabled=!n;
}
/* ---- the shared sheet: read open comments, send waiting ones (plain-text POST: no login, no preflight) ---- */
function load(force){
  if(!SHARED||(!force&&Date.now()-lastLoad<15000))return;lastLoad=Date.now();
  fetch(URL_+(URL_.indexOf('?')<0?'?':'&')+'course='+encodeURIComponent(COURSE.id)+'&t='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.json();}).then(function(d){if(!d||!d.ok)throw 0;remote=d.comments||[];net='up';
      mine=mine.filter(function(c){return !remote.some(function(r){return r.id===c.id;});});store();refresh();})
    .catch(function(){net='down';refresh();});
}
function send(){
  if(!SHARED||sending||!mine.length)return;sending=true;
  var c=mine[0];
  fetch(URL_,{method:'POST',body:JSON.stringify({action:'add',comment:c})}).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok)throw 0;net='up';remote.push(c);mine=mine.filter(function(x){return x.id!==c.id;});store();sending=false;refresh();send();
  }).catch(function(){sending=false;net='down';refresh();});
}
function open_(){pn.hidden=false;tab.setAttribute('aria-expanded','true');g('rvMsg').textContent='';refresh();load();send();g('rvText').focus();}
function close_(){pn.hidden=true;tab.setAttribute('aria-expanded','false');tab.focus();}
tab.addEventListener('click',function(){tipDone();if(pn.hidden)open_();else close_();});
g('rvClose').addEventListener('click',close_);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!pn.hidden)close_();});
g('rvSave').addEventListener('click',function(){
  var t=g('rvText').value.trim();if(!t){g('rvMsg').textContent='Type a comment first.';g('rvText').focus();return;}
  var w=here(),name=by.value.trim();try{localStorage.setItem(NAME,name);}catch(e){}
  mine.push({id:uid(),course:COURSE.id,screen:w.id,screen_no:w.n,lesson:w.sec,screen_type:w.type,heading:w.head,
    language:(typeof LANG!=='undefined'?LANG:''),kind:g('rvKind').value,comment:t,reviewer:name,saved_at:new Date().toISOString()});
  store();g('rvText').value='';g('rvMsg').textContent='Saved.';refresh();send();
});
g('rvList').addEventListener('click',function(e){var b=e.target.closest('.rv-del');if(!b)return;   /* only this browser's own, not-yet-sent comments */
  mine=mine.filter(function(c){return c.id!==b.getAttribute('data-id');});store();refresh();});
function csv(v){v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
g('rvDown').addEventListener('click',function(){
  var cols=['course','screen','screen_no','lesson','screen_type','heading','language','kind','comment','reviewer','saved_at','id'];
  var rows=all().sort(function(a,b){return (a.screen_no-b.screen_no)||(a.saved_at<b.saved_at?-1:1);}).map(function(c){
    return cols.map(function(k){return csv(k==='course'?COURSE.id:c[k]);}).join(',');});
  var blob=new Blob([BOM+cols.join(',')+'\r\n'+rows.join('\r\n')+'\r\n'],{type:'text/csv;charset=utf-8'});
  var who=(by.value.trim()||'reviewer').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'reviewer';
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=COURSE.id+'-review-'+who+'.csv';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
});
if(g('rvClear'))g('rvClear').addEventListener('click',function(){
  if(!mine.length||!window.confirm('Delete all '+mine.length+' comments in this course? Download them first if you have not sent them.'))return;
  mine=[];store();refresh();
});
var _render=render;
render=function(i){_render(i);refresh();setTimeout(place,250);};
if(SHARED){load(true);send();setInterval(function(){if(!document.hidden){load();send();}},60000);window.addEventListener('online',function(){load(true);send();});}
window.addEventListener('beforeunload',function(e){if((mem||SHARED)&&mine.length&&(mem||net==='down')){e.preventDefault();e.returnValue='';}});
})();

boot();
})();
</script>
</body>
</html>
