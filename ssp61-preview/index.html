ا تنتظروا «عند السعة» أبدًا."}, "x_retrieval": {"concept": "density words: Getting full = report now (taught in MK5 / SMP 6.1)", "owner": "mk05"}, "safetyCritical": true, "xp": {"complete": 5, "firstTimeCorrect": 10}, "src": "〔SMP 6.1〕 density words (Getting full: touching, report now); warm-up 〔DECISION 36〕; new situation (A39)", "a11y": {"alternative": "Two labelled buttons (True / False); swipe is optional and maps to the button on that side.", "state": "Each choice shows a tick or a cross and words, never colour alone."}}, {"id": "0.3", "section": "0", "lo": ["brief"], "type": "teach", "kicker": {"sid": "ssp61-S027", "en": "Gate 7", "ar": "البوابة 7"}, "heading": {"sid": "ssp61-S028", "en": "Could you have seen it coming?", "ar": "هل كان يمكنك توقّع ذلك؟"}, "lines": [{"sid": "ssp61-S029", "en": "Thirty-five minutes to kick-off. The queue at Gate 7 jams at the turn.", "ar": "قبل البداية بـ 35 دقيقة. يختنق طابور البوابة 7 عند المنعطف."}, {"sid": "ssp61-S030", "en": "The crowd bunches into an arch. The back of the queue reaches the emergency lane.", "ar": "يتكتل الحشد على شكل قوس. ويصل ذيل الطابور إلى مسار الطوارئ."}, {"sid": "ssp61-S031", "en": "Four hours earlier the plaza was empty. The sponsor stand (a stall in the route) that caused it was already there.", "ar": "قبل أربع ساعات كانت الساحة فارغة. والمنصة (كشك في الطريق) التي سببت ذلك كانت موجودة بالفعل."}], "callout": {"sid": "ssp61-S032", "en": "In this lesson you learn to see it coming.", "ar": "في هذا الدرس، ستتعلمون كيف تتوقعونه قبل أن يصل."}, "media": ["ssp61-s4-turn"], "xp": {"complete": 5}, "src": "〔L6.1 FD-0.1〕 the hook: the arch at the turn, the queue into the emergency lane, 'rewind four hours: the stand is already there'; no clock time (decision 75 K4); the hook question answered by the lesson (C1)"}, {"id": "0.4", "section": "0", "lo": [1, 2, 3, 4], "type": "flashcards", "x_mechanic": "flip", "role": "objectives", "x_minRead": 4, "heading": {"sid": "ssp61-S033", "en": "In this lesson, you learn to:", "ar": "في هذا الدرس، ستتعلمون التالي:"}, "task": {"sid": "ssp61-S034", "en": "Tap each card to read it.", "ar": "اضغطوا على كل بطاقة لقراءتها."}, "cards": [{"icon": "eye", "title": {"sid": "ssp61-S035", "en": "See it coming", "ar": "توقّعوه مبكرًا"}, "text": {"sid": "ssp61-S036", "en": "See where pressure will build, and when. Give space or time, early.", "ar": "انظروا أين سيتشكل الضغط ومتى. وفّروا مساحة أو وقتًا، مبكرًا."}}, {"icon": "hourglass", "title": {"sid": "ssp61-S037", "en": "How long?", "ar": "كم المدة؟"}, "text": {"sid": "ssp61-S038", "en": "Work out how long a gate or stair takes to clear.", "ar": "احسبوا المدة التي تحتاجها بوابة أو درج ليفرغ."}}, {"icon": "person walking", "title": {"sid": "ssp61-S039", "en": "Five behaviours", "ar": "خمسة سلوكيات"}, "text": {"sid": "ssp61-S040", "en": "Name what the crowd is doing where the route narrows. Then act.", "ar": "سمّوا ما يفعله الحشد حيث يضيق الطريق. ثم تصرفوا."}}, {"icon": "clipboard", "title": {"sid": "ssp61-S041", "en": "Your planning grid", "ar": "شبكة تخطيطكم"}, "text": {"sid": "ssp61-S664", "en": "Use the DIM-ICE grid (Design, Information, Management) to plan your zone before the match.", "ar": "استخدموا شبكة DIM-ICE (التصميم، المعلومات، الإدارة) لتخطيط منطقتكم قبل المباراة."}}], "xp": {"complete": 5}, "src": "〔L6.1 §2 LO1-LO4〕 one card per objective, in order (A6)", "a11y": {"alternative": "One card at a time; the card is a button; previous and next are buttons.", "state": "An opened card stays open and is counted in words."}}, {"id": "0.5", "section": "0", "lo": ["brief"], "type": "sectionClose", "takeaway": {"sid": "ssp61-S043", "en": "You know what this lesson is about. Now the 3 Ds.", "ar": "تعرفون موضوع هذا الدرس. والآن الـ3 D."}, "xp": {"complete": 5}, "src": "section 0 close (playbook N2); no stamp"}, {"id": "1.1", "section": "1", "lo": [1], "type": "revealCards", "x_mechanic": "scene", "requireAll": true, "kicker": {"sid": "ssp61-S044", "en": "The 3 Ds", "ar": "الـ3 D"}, "heading": {"sid": "ssp61-S045", "en": "Dynamics + Density = Distress", "ar": "الحركة + الكثافة = الضائقة"}, "task": {"sid": "ssp61-S046", "en": "Turn each card.", "ar": "اقلبوا كل بطاقة."}, "media": ["ssp61-s7-arch"], "cards": [{"front": {"sid": "ssp61-S047", "en": "Dynamics", "ar": "الحركة"}, "back": {"sid": "ssp61-S048", "en": "How the crowd moves.", "ar": "كيف يتحرك الحشد."}, "icon": "person walking"}, {"front": {"sid": "ssp61-S049", "en": "Density", "ar": "الكثافة"}, "back": {"sid": "ssp61-S050", "en": "How tightly packed it is.", "ar": "مدى تراصّ الحشد."}, "icon": "busts in silhouette"}, {"front": {"sid": "ssp61-S051", "en": "Distress", "ar": "الضائقة"}, "back": {"sid": "ssp61-S052", "en": "The result you prevent. People pinned or cannot breathe. Call it in at once.", "ar": "النتيجة التي تمنعونها. أشخاص محشورون أو لا يستطيعون التنفس. بلّغوا فورًا."}, "icon": "warning"}], "xp": {"complete": 5}, "src": "〔L6.1 FD-1.1〕 the equation card: Dynamics (how it moves) + Density (how tightly packed) = Distress (pinned, pushed, swaying, can't breathe; the result you prevent; danger - call it in at once); the flip scene (A62)", "a11y": {"alternative": "Every card is a button; screen readers read the front and the back.", "state": "A turned card shows its back text; the count of turned cards is shown in words."}}, {"id": "1.2", "section": "1", "lo": [1], "type": "teach", "kicker": {"sid": "ssp61-S053", "en": "Three questions", "ar": "ثلاثة أسئلة"}, "heading": {"sid": "ssp61-S054", "en": "Ask these before your marshals have to ask you", "ar": "اسألوا هذه الأسئلة قبل أن يضطر منظّموكم إلى سؤالكم"}, "situation": {"sid": "ssp61-S055", "en": "As a marshal you learned to read a crowd. As a supervisor you plan for it. Alpha 1 is your Area Leader, your link to Control (the VOC). Venue Operations run the building.", "ar": "كمنظّم، تعلمتم قراءة الحشد. وكمشرف، أنتم تخططون له. Alpha 1 هو قائد منطقتكم، وصلتكم بغرفة التحكم. وعمليات الملعب تدير المبنى."}, "lines": [{"sid": "ssp61-S056", "en": "Where will density build?", "ar": "أين ستتشكّل الكثافة؟"}, {"sid": "ssp61-S057", "en": "When?", "ar": "متى؟"}, {"sid": "ssp61-S058", "en": "What will slow it down or squeeze it?", "ar": "ما الذي سيبطئه أو يضغطه؟"}], "callout": {"sid": "ssp61-S059", "en": "You know the density words. Getting full means report now. At capacity means report urgently.", "ar": "تعرفون كلمات الكثافة. «يمتلئ» تعني بلّغوا الآن. و«عند السعة» تعني بلّغوا بإلحاح."}, "icon": "red question mark", "xp": {"complete": 5}, "src": "〔L6.1 FD-1.1〕 the supervisor's three questions ('your marshals report what they see; your job is to ask three questions before they need to'); 〔L6.1 FD-0.2〕 'as a marshal you learned to read a crowd; as a supervisor you plan for it'; density words recap only 〔SMP 6.1〕 (Law 3)"}, {"id": "1.3", "section": "1", "lo": [1], "type": "teach", "kicker": {"sid": "ssp61-S060", "en": "Two levers", "ar": "وسيلتان"}, "heading": {"sid": "ssp61-S061", "en": "Give space, or give time", "ar": "وفّروا مساحة، أو وقتًا"}, "situation": {"sid": "ssp61-S062", "en": "A crowd moves only as fast as its space and time allow, and as fast as the slowest person in it.", "ar": "يتحرك الحشد بالسرعة التي تسمح بها مساحته ووقته فقط، وبسرعة أبطأ شخص فيه."}, "lines": [{"sid": "ssp61-S063", "en": "More arrive each minute than can get through? The queue grows.", "ar": "يصل في كل دقيقة أكثر مما يستطيع العبور؟ يكبر الطابور."}, {"sid": "ssp61-S064", "en": "Change the space, or change the time.", "ar": "غيّروا المساحة، أو غيّروا الوقت."}], "x_compare": {"columns": [{"label": {"sid": "ssp61-S065", "en": "Give space", "ar": "وفّروا مساحة"}, "icon": "left right arrow"}, {"label": {"sid": "ssp61-S066", "en": "Give time", "ar": "وفّروا وقتًا"}, "icon": "hourglass"}], "rows": [{"label": {"sid": "ssp61-S067", "en": "What it means", "ar": "ماذا يعني"}, "icon": "red question mark", "cells": [{"sid": "ssp61-S068", "en": "More room for the same people.", "ar": "مساحة أكبر للأشخاص أنفسهم."}, {"sid": "ssp61-S069", "en": "The same people, spread over more minutes.", "ar": "الأشخاص أنفسهم، موزّعون على دقائق أكثر."}]}, {"label": {"sid": "ssp61-S070", "en": "Examples", "ar": "أمثلة"}, "icon": "clipboard", "cells": [{"sid": "ssp61-S071", "en": "Open a lane. Keep routes the same width. Clear what is in the way. Use the whole route.", "ar": "افتحوا مسارًا. أبقوا عرض الطرق متساويًا. أزيلوا ما يعترض الطريق. استخدموا الطريق كله."}, {"sid": "ssp61-S072", "en": "Tell fans early. Slow the approach further back. A Stop and Hold at the gate, on Control's order. Let people through in phases.", "ar": "أبلغوا المشجعين مبكرًا. أبطئوا الاقتراب في مكان أبعد. الإيقاف والتثبيت عند البوابة، بأمر من غرفة التحكم. اسمحوا للناس بالعبور على مراحل."}]}, {"label": {"sid": "ssp61-S073", "en": "Who decides", "ar": "من يقرّر"}, "icon": "radio", "cells": [{"sid": "ssp61-S074", "en": "Ask for the lane or the wider gap. Report it with the numbers.", "ar": "اطلبوا المسار أو الفجوة الأوسع. بلّغوا بذلك مع الأرقام."}, {"sid": "ssp61-S075", "en": "A Stop and Hold, a filter or a slower approach: Control's order. Never hold a crowd with your bodies.", "ar": "الإيقاف والتثبيت أو التصفية أو إبطاء الاقتراب: بأمر من غرفة التحكم. لا تحتجزوا الحشد بأجسادكم أبدًا."}]}], "requireAll": true}, "xp": {"complete": 5}, "src": "〔L6.1 FD-1.2〕 'a crowd moves only as fast as its space and time allow - and the slowest person sets the pace'; give space (open a lane, same width, clear obstructions, whole route) / give time (information early, slower approach upstream, a hold on instruction, a phased release); 'if more arrive each minute than can get through, the queue grows - change the space, or the time'; hold / lane / filter on instruction 〔SSP61-P4, decision 373〕"}, {"id": "1.4", "section": "1", "lo": [1], "type": "sort", "x_mechanic": "buckets", "bloom": "apply", "kicker": {"sid": "ssp61-S076", "en": "Your turn", "ar": "دوركم الآن"}, "heading": {"sid": "ssp61-S077", "en": "Space or time?", "ar": "مساحة أم وقت؟"}, "task": {"sid": "ssp61-S078", "en": "Tap a card, s at best means ten minutes of pressure at the gate. People in place early. Expect longer.", "ar": "عشر دقائق في أفضل الأحوال تعني عشر دقائق من الضغط عند البوابة. ضعوا الأشخاص في مواقعهم مبكرًا. وتوقعوا مدة أطول."}}, {"left": {"sid": "ssp61-S195", "en": "The stair: about 8 minutes at best", "ar": "الدرج: نحو 8 دقائق في أفضل الأحوال"}, "right": {"sid": "ssp61-S196", "en": "Marshals at the top and the bottom of the stair", "ar": "المنظّمون في أعلى الدرج وأسفله"}, "why": {"sid": "ssp61-S197", "en": "A fall on a stair is the biggest risk. Keep the flat part at the bottom clear.", "ar": "السقوط على الدرج هو الخطر الأكبر. أبقوا الجزء المسطح في الأسفل خاليًا."}}, {"left": {"sid": "ssp61-S198", "en": "The 2 m turn: 200 arrive, 164 get through", "ar": "المنعطف 2 م: يصل 200 ويمر 164"}, "right": {"sid": "ssp61-S199", "en": "Report early with the numbers. Request space or time", "ar": "بلّغوا مبكرًا مع الأرقام. اطلبوا مساحة أو وقتًا"}, "why": {"sid": "ssp61-S200", "en": "The queue grows every minute. Ask early, on instruction.", "ar": "ينمو الطابور كل دقيقة. اطلبوا مبكرًا، بناءً على التعليمات."}}, {"left": {"sid": "ssp61-S201", "en": "\"The estimate says there is room\"", "ar": "\"التقدير يقول إن هناك متسعًا\""}, "right": {"sid": "ssp61-S202", "en": "It is time, not capacity. Never more than the venue plan allows", "ar": "هذا وقت، لا سعة. لا تتجاوزوا أبدًا ما يسمح به مخطط الملعب"}, "why": {"sid": "ssp61-S203", "en": "Never use a flow estimate as capacity.", "ar": "لا تستخدموا تقدير التدفق كسعة أبدًا."}}], "feedbackCorrect": {"sid": "ssp61-S204", "en": "An estimate tells you where to put people, and when to report. Never how many to let in.", "ar": "التقدير يخبركم أين تضعون الأشخاص، ومتى تبلّغون. ولا يخبركم أبدًا كم شخصًا تسمحون بدخوله."}, "x_mistakes": {"uses the flow estimate as capacity": "M9", "reports late or without the numbers": "M14"}, "safetyCritical": true, "xp": {"complete": 5, "firstTimeCorrect": 10}, "src": "〔L6.1 §5.1 'what it means for you' (3 scenarios), Q5 (capa sp61-S398", "en": "Rania walks her zone", "ar": "رانيا تتجول في منطقتها"}, "task": {"sid": "ssp61-S399", "en": "Tap each circle. First Rania's walk, then Mohammad's match.", "ar": "اضغطوا على كل دائرة. أولًا جولة رانيا، ثم مباراة محمد."}, "x_minOpen": 2, "x_stories": [{"title": {"sid": "ssp61-S400", "en": "Rania's walk", "ar": "جولة رانيا"}, "icon": "eye", "cover": "ssp61-r1-plaza", "slides": [{"media": "ssp61-r1-plaza", "text": {"sid": "ssp61-S401", "en": "Four hours before kick-off. Rania walks Gate 7 with her Dot Plan and her grid.", "ar": "قبل انطلاق المباراة بأربع ساعات. تتجول رانيا في البوابة 7 ومعها خطة التوزيع (دوت بلان) وشبكتها."}}, {"media": "ssp61-r2-turn", "text": {"sid": "ssp61-S402", "en": "At the turn to the check point, a sponsor stand narrows the route. Four metres down to two.", "ar": "عند المنعطف المؤدي إلى نقطة التفتيش، تضيّق منصة راعٍ المسار. من 4 م إلى 2 م."}}, {"media": "ssp61-v1-report", "text": {"sid": "ssp61-S403", "en": "Rania: \"Alpha 1, Sierra 2. Gate 7 turn: a stand cuts it to two metres. About 160 a minute. Request it moved. Over.\"", "tags": ["quote"], "ar": "رانيا: \"Alpha 1، معك سييرا 2. منعطف البوابة 7: منصة تضيّقه إلى مترين. نحو 160 في الدقيقة. أطلب نقلها. حوّل.\""}}, {"media": "ssp61-v2-egress", "text": {"sid": "ssp61-S404", "en": "Rania: \"Faisal, gate 7A takes ten minutes at best to clear. Be here before the final whistle. Reem takes the stair foot.\"", "tags": ["quote"], "ar": "رانيا: \"فيصل، بوابة الخروج 7A تحتاج عشر دقائق في أفضل الأحوال لتفرغ. كن هنا قبل صافرة النهاية. ريم عند أسفل الدرج.\""}}, {"media": "ssp61-r3-toilets", "text": {"sid": "ssp61-S405", "en": "Rania: \"The half-time queue will spill into the walkway. Signs to the Gate 8 toilets, and a marshal at the corner.\"", "tags": ["quote"], "ar": "رانيا: \"طابور الاستراحة سيمتد إلى الممر. لافتات إلى دورات مياه البوابة 8، ومنظّم عند الزاوية.\""}}, {"media": "ssp61-r4-card", "text": {"sid": "ssp61-S406", "en": "Her grid is done. One Design problem reported. One Information fix. One Management plan. Before a single fan arrived.", "ar": "اكتملت شبكتها. مشكلة تصميم واحدة بُلّغ عنها. إصلاح واحد للمعلومات. خطة واحدة للإدارة. قبل وصول أي مشجع."}}]}, {"title": {"sid": "ssp61-S407", "en": "Mohammad's match", "ar": "مباراة محمد"}, "icon": "thought balloon", "cover": "ssp61-m1-turn", "slides": [{"media": "ssp61-m1-turn", "text": {"sid": "ssp61-S408", "en": "Another match. Mohammad saw the same stand on his walk. He thought: it is not mine.", "ar": "مباراة أخرى. رأى محمد المنصة نفسها في جولته. فكّر: ليست من مسؤوليتي."}}, {"media": "ssp61-s17-arch", "text": {"sid": "ssp61-S409", "en": "Thirty-five minutes before kick-off. The turn passes about 160 a minute. Two hundred arrive. The queue arches into the emergency lane.", "ar": "قبل انطلاق المباراة بـ35 دقيقة. يمر عند المنعطف نحو 160 في الدقيقة. ويصل 200 شخص. يتقوّس الطابور إلى أن يصل إلى مسار الطوارئ."}}, {"media": "ssp61-v3-late", "text": {"sid": "ssp61-S410", "en": "Mohammad, late: \"Alpha 1, Sierra 2! Gate 7 turn, getting full. The queue is arching into the emergency lane. Request lane 3, now. Over.\"", "tags": ["quote"], "ar": "محمد، متأخرًا: \"Alpha 1، معك سييرا 2! منعطف البوابة 7 يمتلئ. الطابور يتقوّس حتى مسار الطوارئ. أطلب المسار 3، الآن. حوّل.\""}}, {"media": "ssp61-v4-calm", "text": {"sid": "ssp61-S662", "en": "Faisal, at the back of the queue: \"Please slow down. Walk, do not run. There is room for everyone. Thank you.\" Calm words. Never \"hurry up\".", "tags": ["quote"], "ar": "فيصل في آخر الطابور: \"تمهّلوا من فضلكم. امشوا ولا تركضوا. يوجد مكان للجميع. شكرًا لكم.\" كلمات هادئة. لا تقولوا «أسرعوا» أبدًا."}}, {"media": "ssp61-s17-arch", "text": {"sid": "ssp61-S663", "en": "Report a Design problem on the walk. If you do not, it becomes your problem at the rush.", "ar": "بلّغوا عن مشكلة التصميم أثناء الجولة. وإذا لم تفعلوا، تصبح مشكلتكم وقت الذروة."}}]}], "x_takeaway": {"sid": "ssp61-S411", "en": "Rania reported the Design problem, fixed the information, and planned the egress. All before the gates opened.", "ar": "رانيا بلّغت عن مشكلة التصميم، وأصلحت المعلومات، وخططت للخروج. كل ذلك قبل فتح البوابات."}, "x_story": [], "xp": {"complete": 5}, "src": "〔L6.1 FD-5.1〕 the pre-match walk and its three stops (the stand → Alpha 1 / Venue Operations; gate 7A → egress positions; toilets → signs and a marshal at the corner); 〔FD-5.2〕 one reported, one fix, one plan; 〔DP1 A consequence〕 Mohammad's contrast; Rania's estimate as her recorded voice on slide 3 (ssp61-au-estimate; no video, rule A67, decision 380); cast Rania and Mohammad (decisions 369, 373); 'metro' never used | 7 Nov 2026 (user: 'I need videos, impactful ones'; main session as designer): four 8-s speaking clips, one speaker each, no crowd (A66/A67): v1 Rania's report (replaces the voice line ssp61-au-estimate), v2 Rania briefs Faisal at 7A, v3 Mohammad's late call (replaces picture m2-radio), v4 Faisal's calm words (the lesson said 'calm words' but never gave them)", "a11y": {"alternative": "Every story is a button; Back, Next and Close are buttons; every line is on screen.", "state": "A finished story shows a tick on its circle."}, "x_teaches": "The learner hears four model lines they must use: the report of a Design problem with its numbers, a brief that turns an estimate into positions, an urgent Getting-full call, and calm words that slow a pushing queue; and sees the cost of reporting late. No other screen gives these words."}, {"id": "5.2", "section": "5", "lo": [4], "type": "order", "x_mechanic": "stack", "bloom": "apply", "kicker": {"sid": "ssp61-S412", "en": "Your turn", "ar": "دوركم الآن"}, "heading": {"sid": "ssp61-S413", "en": "The walk, step by step", "ar": "الجولة خطوة بخطوة"}, "task": {"sid": "ssp61-S414", "en": "Tap Rania's steps in the right order, first to last.", "ar": "اضغطوا على خطوات رانيا بالترتيب الصحيح، من الأولى إلى الأخيرة."}, "steps": [{"sid": "ssp61-S415", "en": "Walk the zone with the Dot Plan", "ar": "التجول في المنطقة مع خطة التوزيع"}, {"sid": "ssp61-S416", "en": "Estimate the flow at each pinch point", "ar": "تقدير التدفق عند كل نقطة اختناق"}, {"sid": "ssp61-S417", "en": "Report the Design problems to Alpha 1", "ar": "إبلاغ Alpha 1 بمشكلات التصميم"}, {"sid": "ssp61-S418", "en": "Fix the information and plan the positions", "ar": "إصلاح المعلومات وتخطيط المواقع"}, {"sid": "ssp61-S419", "en": "Brief the team and log it", "ar": "إحاطة الفريق وتسجيل ذلك"}], "x_why": [{"sid": "ssp61-S420", "en": "The walk comes first, before the briefing.", "ar": "تأتي الجولة أولًا، قبل الإحاطة."}, {"sid": "ssp61-S421", "en": "At each pinch point she puts a number on it.", "ar": "عند كل نقطة اختناق تضع رقمًا لها."}, {"sid": "ssp61-S422", "en": "Design problems go up early, with the estimate.", "ar": "مشكلات التصميم تُرفع مبكرًا، مع التقدير."}, {"sid": "ssp61-S423", "en": "Information and Management are hers to fix.", "ar": "المعلومات والإدارة من مسؤوليتها."}, {"sid": "ssp61-S424", "en": "The answers go into the briefing and the log.", "ar": "الإجابات تدخل في الإحاطة والسجل."}], "feedbackCorrect": {"sid": "ssp61-S425", "en": "That is the walk. Early, with numbers, and the right people told.", "ar": "هذه هي الجولة. مبكرًا، بالأرقام، مع إبلاغ الأشخاص المناسبين."}, "feedbackWrong": {"sid": "ssp61-S426", "en": "Not quite. Walk, estimate, report, fix, brief.", "ar": "ليس تمامًا. تجوّلوا، قدّروا، بلّغوا، أصلحوا، أحيطوا."}, "safetyCritical": false, "xp": {"complete": 5, "firstTimeCorrect": 10}, "src": "〔L6.1 FD-4.2, FD-5.1〕 (practice of 4.2 and 5.1)", "a11y": {"alternative": "Every step has up and down buttons; the order is read out as a numbered list.", "state": "A step in the right place shows a tick and words.", "transcriptFrom": "none"}}, {"id": "5.3", "section": "5", "lo": [4], "type": "trueFalse", "x_mechanic": "card", "bloom": "apply", "kicker": {"sid": "ssp61-S427", "en": "Your turn", "ar": "دوركم الآن"}, "statement": {"sid": "ssp61-S428", "en": "Mohammad's marshals could have moved the stand themselves and saved the evening.", "ar": "كان بإمكان منظّمي محمد نقل المنصة بأنفسهم وإنقاذ المساء."}, "answer": false, "feedbackTrue": {"sid": "ssp61-S429", "en": "Think again. The stand belongs to someone else. It may be fixed or powered.", "ar": "فكّروا مرة أخرى. المنصة تخص جهة أخرى. قد تكون مثبّتة أو موصولة بالكهرباء."}, "feedbackFalse": {"sid": "ssp61-S430", "en": "Report it so the right people move it. Never move it yourselves.", "ar": "بلّغوا عنها ليقوم المعنيّون بنقلها. ولا تنقلوها بأنفسكم أبدًا."}, "x_mistakes": {"has the marshals move the stand themselves": "M2"}, "safetyCritical": false, "xp": {"complete": 5, "firstTimeCorrect": 10}, "src": "〔L6.1 DP1 C〕 'it may be fixed or powered, and it belongs to someone else; report it so the right people move it' (SSP61-P5)", "a11y": {"alternative": "Two labelled buttons (True / False); swipe is optional and maps to the button on that side.", "state": "Each choice shows a tick or a cross and words, never colour alone."}}, {"id": "5.4", "section": "5", "lo": [1, 2, 3, 4], "type": "sectionClose", "takeaway": {"sid": "ssp61-S431", "en": "You have seen a supervisor plan a zone before the gates open. Early, with numbers, and the right people told.", "ar": "رأيتم مشرفًا يخطط منطقته قبل فتح البوابات. مبكرًا، بالأرقام، مع إبلاغ الأشخاص المناسبين."}, "xp": {"complete": 20}, "src": "stamp from module.sections[5]"}, {"id": "6.1", "section": "6", "lo": [1, 2, 3, 4], "type": "teach", "kicker": {"sid": "ssp61-S432", "en": "Your zone", "ar": "منطقتكم"}, "heading": {"sid": "ssp61-S433", "en": "The pinch point at Gate 7", "ar": "نقطة الاختناق عند البوابة 7"}, "lines": [{"sid": "ssp61-S434", "en": "Now it is your turn. You are the Gate 7 supervisor, Sierra 2, like Rania. Fifteen marshals, Faisal is Marshal 22.", "ar": "الآن جاء دوركم. تتولون دور مشرف البوابة 7، سييرا 2، مثل رانيا. خمسة عشر منظّمًا، وفيصل هو المنظّم 22."}, {"sid": "ssp61-S435", "en": "Start four hours before kick-off. Follow your decisions through to the rush. Your first choice in each moment earns the points.", "ar": "ابدؤوا قبل انطلاق المباراة بأربع ساعات. تابعوا قراراتكم حتى وقت الذروة. أول خيار لكم في كل لحظة يمنحكم النقاط."}, {"sid": "ssp61-S436", "en": "On the radio, call each marshal by name. Each one repeats your order back.", "ar": "على اللاسلكي، نادوا كل منظّم باسمه. وكل واحد منهم يكرر أمركم."}], "media": ["ssp61-s16-stand"], "xp": {"complete": 5}, "src": "〔L6.1 FD-7.1, §5.3 setting〕 Marshals 21-35, Faisal = Marshal 22, Alpha 1 = Abdullah, learner = Sierra 2 (SSP61-P10)"}, {"id": "6.2", "section": "6", "lo": [4], "type": "branch", "bloom": "evaluate", "kicker": {"sid": "ssp61-S437", "en": "Decision 1 of 4", "ar": "القرار 1 من 4"}, "scene": {"sid": "ssp61-S438", "en": "Four hours before kick-off. On your walk you reach the turn. A sponsor stand narrows the route from 4 m to 2 m. The late wave (fans arriving in the last half hour) will come this way. You feel a small doubt: is this mine to fix?", "ar": "قبل انطلاق المباراة بأربع ساعات. أثناء جولتكم تصلون إلى المنعطف. تضيّق منصة راعٍ المسار من 4 م إلى 2 م. الموجة المتأخرة (المشجعون الذين يصلون في آخر نصف ساعة) ستأتي من هنا. يراودكم شك صغير: هل إصلاحها مسؤوليتي؟"}, "task": {"sid": "ssp61-S439", "en": "What do you do?", "ar": "ماذا تفعلون الآن؟"}, "media": ["ssp61-s16-stand"], "options": [{"text": {"sid": "ssp61-S747", "en": "It is not yours to fix. Leave it where it is and carry on with your walk, so the plan stays on time", "ar": "ليس إصلاحها من مهامكم. اتركوها مكانها وواصلوا جولتكم كي تبقى الخطة في وقتها"}, "score": 0, "feedback": {"sid": "ssp61-S441", "en": "Not this time. At the rush the turn passes 160 a minute while 200 arrive. Report it early, with your estimate.", "ar": "ليس هذه المرة. عند الذروة يمر عند المنعطف 160 في الدقيقة بينما يصل 200. بلّغوا مبكرًا مع تقديركم."}, "x_trap": "polite", "x_breaks": "M1", "goto": "6.3"}, {"text": {"sid": "ssp61-S748", "en": "Radio Alpha 1: route down to 2 m, about 160 a minute at best. Request Venue Operations move it. Log it", "ar": "أبلغوا Alpha 1 لاسلكيًا: المسار ضاق إلى مترين ية عند الساحة.\" فريقكم ينتظر كلماتكم على اللاسلكي."}, "task": {"sid": "ssp61-S473", "en": "How do you instruct them?", "ar": "كيف توجّهونهم؟"}, "media": ["ssp61-s18-lane3"], "options": [{"text": {"sid": "ssp61-S753", "en": "One message to everyone: \"Sort out the queue, everyone, open the lane and get the people moving as fast as you can.\"", "ar": "رسالة واحدة للجميع: \"رتّبوا الطابور يا جماعة، افتحوا المسار وحرّكوا الناس بأسرع ما يمكن.\""}, "score": 0, "feedback": {"sid": "ssp61-S475", "en": "Think again. Three marshals move the same barrier. Nobody watches the emergency lane.", "ar": "فكّروا مرة أخرى. ثلاثة منظّمين ينقلون الحاجز نفسه. ولا أحد يراقب مسار الطوارئ."}, "x_trap": "polite", "x_breaks": "M5", "goto": "6.7"}, {"text": {"sid": "ssp61-S754", "en": "Go and move the barriers yourself, leave the radio with Marshal 24, and come back when the lane is open and flowing", "ar": "اذهبوا وحرّكوا الحواجز بأنفسكم، واتركوا جهاز اللاسلكي مع المنظّم 24، وعودوا عندما يُفتح المسار ويتدفق"}, "score": 1, "feedback": {"sid": "ssp61-S477", "en": "Almost. It gets done. But nobody leads the zone or talks to Alpha 1 while you do it.", "ar": "تقريبًا. يتم الأمر. لكن لا أحد يقود المنطقة أو يتحدث مع Alpha 1 بينما تفعلون ذلك."}, "x_trap": "polite", "x_breaks": "M6", "goto": "6.7"}, {"text": {"sid": "ssp61-S755", "en": "By name: \"30 and 31, open lane 3. 33, slow the approach, calm words. 24, emergency lane clear.\" Each one repeats it back", "ar": "بالأسماء: \"30 و31، افتحا المسار 3. 33، أبطئ الاقتراب بكلمات هادئة. 24، أبقِ مسار الطوارئ فارغًا.\" ويكرر كل واحد التعليمات"}, "score": 2, "feedback": {"sid": "ssp61-S479", "en": "Clear, named instructions. The change happens in a controlled way.", "ar": "تعليمات واضحة بالأسماء. يتم التغيير بشكل منضبط."}, "goto": "6.7"}], "safetyCritical": false, "xp": {"complete": 5}, "src": "〔L6.1 §5.3 DP3〕 ratings BEST / POOR / ACCEPTABLE", "a11y": {"alternative": "Every choice is a labelled button; the scene is text on screen.", "state": "The result screen names what happened in words."}}, {"id": "6.7", "section": "6", "lo": [4], "type": "consequence", "outcome": {"sid": "ssp61-S480", "en": "Lane 3 opens in a controlled way. Every marshal knows their job.", "ar": "يُفتح المسار 3 بشكل منضبط. وكل منظّم يعرف مهمته."}, "why": {"sid": "ssp61-S481", "en": "Orders by name, and each one repeated back.", "ar": "أوامر بالاسم، وكل واحد منها يُكرَّر."}, "next": "6.8", "media": ["ssp61-s18-lane3"], "x_variants": [{"when": {"screen": "6.6", "option": 0}, "tone": "bad", "headline": {"sid": "ssp61-S482", "en": "Three marshals move the same barrier. Nobody watches the emergency lane.", "ar": "ثلاثة منظّمين ينقلون الحاجز نفسه. ولا أحد يراقب مسار الطوارئ."}, "lines": [{"sid": "ssp61-S483", "en": "Give orders by name. Have each one repeated back.", "ar": "أعطوا الأوامر بالاسم. واطلبوا تكرار كل أمر."}]}, {"when": {"screen": "6.6", "option": 1}, "tone": "mixed", "headline": {"sid": "ssp61-S484", "en": "The barriers move. But nobody leads the zone, and Alpha 1 cannot reach you.", "ar": "تتحرك الحواجز. لكن لا أحد يقود المنطقة، ولا يستطيع Alpha 1 الوصول إليكم."}, "lines": [{"sid": "ssp61-S485", "en": "Stay on the radio. Send the marshals by name.", "ar": "ابقوا على اللاسلكي. أرسلوا المنظّمين بالاسم."}]}, {"when": {"screen": "6.6", "option": 2}, "tone": "good", "headline": {"sid": "ssp61-S486", "en": "Lane 3 opens in a controlled way. Every marshal knows their job.", "ar": "يُفتح المسار 3 بشكل منضبط. وكل منظّم يعرف مهمته."}, "lines": [{"sid": "ssp61-S487", "en": "Orders by name, and each one repeated back.", "ar": "أوامر بالاسم، وكل واحد منها يُكرَّر."}]}], "x_tryAgain": true, "xp": {"complete": 5}, "src": "〔L6.1 §5.3 DP3〕 ratings BEST / POOR / ACCEPTABLE"}, {"id": "6.8", "section": "6", "lo": [2, 4], "type": "branch", "bloom": "evaluate", "kicker": {"sid": "ssp61-S488", "en": "Decision 4 of 4", "ar": "القرار 4 من 4"}, "scene": {"sid": "ssp61-S489", "en": "Kick-off. The queue is gone. You have time to think about the final whistle.", "ar _breaks": "M10"}, {"text": {"sid": "ssp61-S586", "en": "About 1,000", "ar": "نحو 1,000"}, "score": 0, "feedback": {"sid": "ssp61-S587", "en": "Think again. No stair passes 1,000 a minute. 2 × 66 is about 130.", "ar": "فكّروا مرة أخرى. لا يمرّر أي درج 1,000 في الدقيقة. 2 × 66 نحو 130."}, "x_trap": "mistake", "x_breaks": "Q4 D"}, {"text": {"sid": "ssp61-S588", "en": "About 130", "ar": "نحو 130"}, "score": 2, "feedback": {"sid": "ssp61-S589", "en": "2 × 66 = 132 a minute at best on steps.", "ar": "2 × 66 = 132 في الدقيقة في أفضل الأحوال على الدرج."}}], "safetyCritical": false, "src": "〔L6.1 Q4〕", "xp": {"complete": 0, "firstTimeCorrect": 0}, "variantGroup": "flow-figure"}, {"id": "Q05", "section": "pool", "lo": [2], "type": "mcq", "bloom": "apply", "task": {"sid": "ssp61-S590", "en": "Your flow estimate says the area could take more people. Can you let more in?", "ar": "يشير تقدير التدفّق إلى أن المنطقة يمكن أن تستوعب مزيدًا من الأشخاص. هل يمكنك السماح بدخول المزيد؟"}, "options": [{"text": {"sid": "ssp61-S591", "en": "Yes. The estimate shows there is room for more", "ar": "نعم. التقدير يبيّن أن هناك مكانًا لمزيد"}, "score": 0, "feedback": {"sid": "ssp61-S592", "en": "Careful. An estimate is about time, never about room.", "ar": "انتبهوا. التقدير عن الوقت، وليس عن المكان أبدًا."}, "x_trap": "polite", "x_breaks": "M9"}, {"text": {"sid": "ssp61-S593", "en": "No. The estimate is about time. The venue plan sets the capacity", "ar": "لا. التقدير عن الوقت. وخطة الملعب هي التي تحدد السعة"}, "score": 2, "feedback": {"sid": "ssp61-S594", "en": "Never use a flow estimate as capacity. Never exceed area capacity.", "ar": "لا تستخدم تقدير التدفّق لتحديد السعة أبدًا، ولا تتجاوز السعة المحددة للمنطقة."}}, {"text": {"sid": "ssp61-S595", "en": "No, unless Alpha 1 says there is room", "ar": "لا، إلا إذا قال Alpha 1 إن هناك مكانًا"}, "score": 0, "feedback": {"sid": "ssp61-S596", "en": "Think again. Nobody can add capacity. The venue plan sets it.", "ar": "فكّروا مرة أخرى. لا أحد يستطيع زيادة السعة. خطة الملعب هي التي تحددها."}, "x_trap": "polite", "x_breaks": "M9"}, {"text": {"sid": "ssp61-S597", "en": "Yes, if two marshals watch the gap all the time", "ar": "نعم، إذا راقب منظّمان الفجوة طوال الوقت"}, "score": 0, "feedback": {"sid": "ssp61-S598", "en": "Not this time. Watching does not add capacity. The venue plan sets it.", "ar": "ليس هذه المرة. المراقبة لا تزيد السعة. خطة الملعب هي التي تحددها."}, "x_trap": "polite", "x_breaks": "M9"}], "safetyCritical": true, "src": "〔L6.1 Q5〕 SC", "xp": {"complete": 0, "firstTimeCorrect": 10}}, {"id": "Q06", "section": "pool", "lo": [2], "type": "mcq", "bloom": "apply", "task": {"sid": "ssp61-S599", "en": "Your gate is 6 m wide but the route narrows to 2 m at a turn. Which width sets the pace?", "ar": "بوابتك بعرض 6 م لكن الطريق يضيق إلى 2 م عند منعطف. أي عرض يحدد الوتيرة؟"}, "options": [{"text": {"sid": "ssp61-S600", "en": "6 m, the width of the gate", "ar": "6 م، عرض البوابة"}, "score": 0, "feedback": {"sid": "ssp61-S601", "en": "Not quite. The gate is wide, but the turn is what everyone must pass.", "ar": "ليس تمامًا. البوابة عريضة، لكن المنعطف هو ما يجب أن يمر منه الجميع."}, "x_trap": "mistake", "x_breaks": "M10"}, {"text": {"sid": "ssp61-S602", "en": "4 m, the average of the two", "ar": "4 م، متوسط الاثنين"}, "score": 0, "feedback": {"sid": "ssp61-S603", "en": "Careful. An average hides the narrow turn. Use the narrowest width.", "ar": "انتبهوا. المتوسط يخفي المنعطف الضيق. استخدموا أضيق عرض."}, "x_trap": "mistake", "x_breaks": "M10"}, {"text": {"sid": "ssp61-S604", "en": "8 m, the gate and the turn added", "ar": "8 م، مجموع البوابة والمنعطف"}, "score": 0, "feedback": {"sid": "ssp61-S605", "en": "Think again. Widths are not added. The narrowest one sets the pace.", "ar": "فكّروا مرة أخرى. العروض لا تُجمع. أضيقها هو الذي يحدد الوتيرة."}, "x_trap": "mistake", "x_breaks": "Q6 D"}, {"text": {"sid": "ssp61-S606", "en": "2 m, the width at the turn", "ar": "2 م، عرض المنعطف"}, "score": 2, "feedback": {"sid": "ssp61-S607", "en": "A route is only as fast as its narrowest point.", "ar": "المسار لا يكون أسرع من أضيق نقطة فيه."}}], "safetyCritical": false, "src": "〔L6.1 Q6〕", "xp": {"complete": 0, "firstTimeCorrect": 0}}, {"id": "Q07", "section": "pool", "lo": [3], "type": "mcq", "bloom": "apply", "task": {"sid": "ssp61-S608", "en": "Fans keep cutting through a gap in the barriers. What do you do?", "ar": "يواصل المشجعون المرور عبر فجوة في الحواجز. ماذا تفعل؟"}, "options": [{"text": {"sid": "ssp61-S609", "en": "Have the gap closed and put a marshal where it tempts", "ar": "إغلاق الفجوة ووضع منظّم عند المكان المغري"}, "score": 2, "feedback": {"sid": "ssp61-S610", "en": "Shortcuts: design them out, and watch the tempting point.", "ar": "الطرق المختصرة: أزل أسباب استخدامها من تصميم المسار، وراقب النقاط التي قد تغري المشجعين بها."}}, {"text": {"sid": "ssp61-S611", "en": "Stand in the gap yourself and block them with your body", "ar": "الوقوف في الفجوة بأنفسكم وحجبهم بأجسادكم"}, "score": 0, "feedback": {"sid": "ssp61-S612", "en": "Careful. Never block fans with your body. Close the gap instead.", "ar": "انتبهوا. لا تحجبوا المشجعين بأجسادكم أبدًا. أغلقوا الفجوة بدل ذلك."}, "x_trap": "mistake", "x_breaks": "M11"}, {"text": {"sid": "ssp61-S613", "en": "Let them through, since it is quicker for everyone", "ar": "السماح لهم بالمرور لأن ذلك أسرع للجميع"}, "score": 0, "feedback": {"sid": "ssp61-S614", "en": "Think again. The shortcut grows and the lanes empty. Close the gap.", "ar": "فكّروا مرة أخرى. يكبر الطريق المختصر وتفرغ المسارات. أغلقوا الفجوة."}, "x_trap": "polite", "x_breaks": "M11"}, {"text": {"sid": "ssp61-S615", "en": "Ask them kindly to stop, and leave the gap as it is", "ar": "طلب التوقف منهم بلطف، وترك الفجوة كما هي"}, "score": 0, "feedback": {"sid": "ssp61-S616", "en": "Not this time. Kind words alone do not close a gap. Have it closed.", "ar": "ليس هذه المرة. الكلام اللطيف وحده لا يغلق الفجوة. اطلبوا إغلاقها."}, "x_trap": "polite", "x_breaks": "M11"}], "safetyCritical": false, /* ============ SCHEMA 2.0 ADAPTER ============
   The script skill (elearning-module-designer) writes script.json "schema 2.0":
     strings {sid, en, ar?}, section as string, one answer model (score 0/1/2), media = asset ids,
     consequence {outcome, why, next}, multiselect options[], imageTiles tiles[]{media, score, feedback},
     branch goto, order feedbackCorrect/feedbackWrong, placeholder {id, owner, note}, module.quiz, module.passMark {percent, display}.
   This file normalises such a script in place so the runtime (built for the earlier shape) renders it unchanged.
   Runs before buildFromScript(). Idempotent. */

function sc2_rating(o){if(o.rating)return o.rating;if('score' in o)return o.score===2?'best':o.score===1?'ok':'wrong';return o.correct===true?'best':'wrong';}
function sc2_assetFile(id,kind){
  if(!id||/\.(mp4|jpg|jpeg|png|webp|gif|svg)$/i.test(id))return id;
  var a=(COURSE.assets||{})[id];
  if(a&&a.file)return a.file;
  return id+(((a&&a.kind)==='video'||kind==='video')?'.mp4':'.jpg');
}
function adaptSchema2(S){
  if(!S||S.__adapted)return S;S.__adapted=true;
  var M=S.module||{};
  if(M.passMark&&typeof M.passMark==='object'){COURSE.passDisplay=M.passMark.display;}
  (M.sections||[]).forEach(function(sec){if(typeof sec.n==='string'&&/^\d+$/.test(sec.n))sec.n=+sec.n;});
  var Q=M.quiz||null;
  function fixMedia(s){
    if(!s.media)return;
    var arr=Array.isArray(s.media)?s.media:[s.media];
    s.media=arr.map(function(m){return sc2_assetFile(m,s.type==='video'?'video':null);});
  }
  function fixScreen(s){
    if(typeof s.section==='string'&&/^\d+$/.test(s.section))s.section=+s.section;
    fixMedia(s);
    if(s.placeholder&&typeof s.placeholder==='object'){s.x_placeholder=true;if(!s.x_placeholderNote)s.x_placeholderNote=s.placeholder.note||s.placeholder.id;}
    (s.options||[]).forEach(function(o){if(!o.rating)o.rating=sc2_rating(o);if(o.goto&&!o.goTo)o.goTo=o.goto;});
    switch(s.type){
      case 'multiselect':
        if(!s.items&&s.options){s.items=s.options.map(function(o){return {text:o.text,correct:sc2_rating(o)!=='wrong',icon:o.icon,why:o.feedback};});}
        if(s.feedbackCorrect&&!s.x_feedbackCorrect)s.x_feedbackCorrect=s.feedbackCorrect;
        break;
      case 'imageTiles':
        (s.tiles||[]).forEach(function(t){if(t.correct===undefined&&'score' in t)t.correct=t.score===2;if(!t.why&&t.feedback)t.why=t.feedback;if(t.media)t.media=sc2_assetFile(t.media,null);});
        break;
      case 'consequence':
        if(!s.headline&&s.outcome)s.headline=s.outcome;
        /* 'why' the same words as 'outcome' (the heading) is not shown twice (learner QA, 2026-11-04) */
        if(!s.lines&&s.why){var _sw=function(v){return v&&typeof v==='object'?String(v.en||'').trim():String(v||'').trim();};
          if(!(s.headline&&_sw(s.why)&&_sw(s.why)===_sw(s.headline)))s.lines=[s.why];}
        if(!s.tone)s.tone='mixed';
        if(s.next&&!s.x_next)s.x_next=s.next;
        break;
      case 'branch':
        if(!s.situation&&s.scene)s.situation=s.scene;
        break;
      case 'order':
        if(!s.okText&&s.feedbackCorrect)s.okText=s.feedbackCorrect;
        if(!s.noText&&s.feedbackWrong)s.noText=s.feedbackWrong;
        break;
      case 'moduleQuiz':
        if(Q){if(s.count===undefined)s.count=Q.itemsShown;if(s.passMark===undefined)s.passMark=Q.passPercent;if(s.retries===undefined)s.retries=Q.retries;if(s.feedbackAfterEach===undefined)s.feedbackAfterEach=Q.feedbackAfterEach!==false;
          if(s.perObjective===undefined)s.perObjective=Q.perObjective;if(s.shuffleOptions===undefined)s.shuffleOptions=Q.shuffleOptions;if(s.randomise===undefined)s.randomise=Q.randomise;if(s.minSafety===undefined)s.minSafety=Q.minSafety;if(s.safetyMustPass===undefined)s.safetyMustPass=Q.safetyMustPass;}
        if(!s.lines&&s.intro)s.lines=[s.intro];
        break;
      case 'flashcards':
        (s.cards||[]).forEach(function(c){if(c.media)c.media=sc2_assetFile(c.media,null);});
        break;
      case 'finalQuestion':
        if(typeof s.learnIn==='string'&&!s.learnInText)s.x_learnInCode=s.learnIn;
        break;
    }
  }
  (S.screens||[]).forEach(fixScreen);
  (S.quizPool||[]).forEach(function(q){fixScreen(q);if(!q.stem&&q.task)q.stem=q.task;});
  return S;
}

/* ============ SCRIPT TYPES (part 5): story and release helpers ============
   Loaded after script-schema2.js. Adds, for any module:
     x_hideUntilFilled   screen is dropped while its media is missing (build.py sets x_mediaMissing) — no empty screens
     x_variants          consequence text that depends on an earlier branch pick: [{when:{screen,option}, headline, lines}]
     x_storyScore        score line for a story: {branches:[ids], bonus:n, perBest:n, label?} → "You scored 5 of 6. Best path earns 10 bonus points."
                         perBest: n XP for every branch whose FIRST choice was the best; the branches say the first choice counts
     x_storyRecap        debrief by first pick: [{branch:"<branch id>", label:{…}, lines:[{…} per option, same order]}] → label, "You chose: <option>", the line for that pick; "Not answered yet" if not visited
     x_tryAgain          true on a consequence: Try again + Continue whatever the tone (default: only tone 'mixed')
     x_jobAid            an in-course job aid {title, lines[]} shown in the Job aids panel (📎), with the PDFs; works offline
     chips streak        "3 right in a row" counter on the phrase game (plain words, never timed)            */

function storyScore(cfg){

/* ---- 5. baseline decisions (E1, 2026-10-25): confidence after the first pick, baseline points, LMS record ----

/* ============ SCRIPT MECHANICS (part 6): many ways to play the same activity ============
   The same content (script.json) can be played with different mechanics, so a module never feels like
   "the same sort again". A screen picks one with `x_mechanic`; when it does not, the engine rotates through
   the mechanics that fit the content, seeded by the module id (different modules → different order).
   Every mechanic: buttons first (tap + keyboard; swipe/drag only as extras), mirrored in RTL, never timed,
   feedback says why, first-time-correct XP only when no mistake was made.

     sort        buckets (tap card → column) · deck (one card at a time, two big choices, swipe optional)
                 · belt (cards queue on a conveyor, send each to a bin) · stamps (a sheet: stamp every line, then check)
     mcq         list (option list) · tiles (2×2 picture-style tiles) · doors (side-by-side choices, ≤3 options)
                 · chat (reply bubbles; only when every option is something you say, in quotes)
     order       list (▲▼) · stack (tap the next step; cards pile up in order) · path (steps placed on a route)
     trueFalse   card (two buttons + swipe; the default, no rotation) · stamp (stamp on a paper) · thumbs (👍 / 👎 mark) — all with the same ✓ True / ✕ False buttons
     revealCards scene (glass cards over a scene, picture fixed, panel turns left-right; explicit only — script-types.js sceneCards)
     match       pairs (tap an item, then its partner) · memory (face-down cards, turn two at a time)  [new type]
     hotspot     findAll (several correct spots on a picture: "Found 2 of 4") · askEach (the spots asked one at a time) — explicit only                       */

var MECH={
  sort:['buckets','deck','belt','stamps'],
  mcq:['list','tiles','doors','chat'],
  order:['list','stack','path'],
  trueFalse:['card','stamp','thumbs'],
  match:['pairs','memory']

var _mechSeed=(function(){var h=0,id=String(COURSE.id||'');for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return h;})();
var _mechCount={};
function mechFits(type,m,s){
  if(type==='mcq'){
    var o=s.options||[];
    if(m==='doors')return o.length>=2&&o.length<=3;
    if(m==='chat')return o.length&&o.every(function(x){return /^\s*['"‘“]/.test(T(x.text));});
    if(m==='tiles')return o.length>=3&&o.length<=4&&o.every(function(x){return T(x.text).length<=70;});
  }
  if(type==='sort'&&m==='stamps')return (s.cards||[]).length<=10;
  if(type==='match'&&m==='memory')return (s.pairs||[]).length<=6;
  return true;
}
/* the mechanic for this screen: explicit x_mechanic, else the module's rotation over the mechanics that fit */
function mechanicFor(type,s){
  var list=MECH[type]||[],want=s.x_mechanic||s.mechanic;
  if(want&&list.indexOf(want)>=0&&mechFits(type,want,s))return want;
  if(!s._mech){
    var k=_mechCount[type]=(_mechCount[type]||0)+1,fits=list.filter(function(m){return mechFits(type,m,s);});
    s._mech=fits.length?fits[(_mechSeed+k)%fits.length]:list[0];

/* the rotation must not depend on the order screens are visited: number every screen once, in course order */
(function(){var _bfs=buildFromScript;buildFromScript=function(){
  (SCRIPT.screens||[]).forEach(function(s){if(MECH[s.type])mechanicFor(s.type,s);});
  _bfs();};})();

/* ---------------------------------------------------------------- HOTSPOT: ask each (E1, 2026-10-19) ------ */
/* One picture, the right targets asked one at a time ('Where is the vomitory?' = target.x_ask, else its name).

   A found target gets its name as a label on the picture and shows its `action` line. XP: s.xp.perTarget for each
   target right first time; mechDone at the end (firstTimeCorrect only for a run with no wrong tap).
   Buttons under the picture (the target names) are the keyboard / screen-reader alternative. */
/* E1 (2026-10-20) pages + choices:
   s.x_pages = [{media, alt, title, targets[], x_end, x_next}] — several pictures in turn (e.g. tickets), each with its own targets;
   after a page's last target its x_end line shows and 'Next' (x_next) opens the next page. Without x_pages: one page = s.media + s.targets.
   target.x_choices = [{text, best:true|false, feedback}] — once the place is found, the question x_choiceAsk (target, else screen)
   and the options; a wrong pick shows its feedback and stays open; the best ends the step (XP s.xp.perChoice if picked first time).
   A target with x_choices and no x (x_noSpot) is a choices-only step: nothing to tap on the picture.
   E1 (2026-10-21): a target may carry `media` (an image asset id): shown above its question (16:9, cover, at most 45vh; alt text

    :[{img:media(s)[0],alt:T(s.heading)||'',title:'',tg:(s.targets||[]).filter(keep),end:'',nxt:''}];

  var ptitle=el('<p class="askpage"></p>'),ask=el('<div class="askq" role="status" aria-live="polite"></div>'),cnt=el('<div class="findcount"></div>'),
      wrap=el('<div class="scene-wrap m-findall m-askeach"></div>'),list=el('<div class="findlist"></div>'),
      chHost=el('<div class="askchoices"></div>'),fbHost=el('<div class="mfb" role="status"></div>'),pgBar=el('<div class="askpagebar"></div>');
  h.appendChild(cnt);h.appendChild(ptitle);h.appendChild(ask);h.appendChild(wrap);h.appendChild(list);h.appendChild(chHost);h.appendChild(fbHost);h.appendChild(pgBar);

      var b=el('<button type="button" class="hz2" style="left:'+t.x+'%;top:'+t.y+'%;width:'+t.w+'%;height:'+t.h+'%" aria-label="'+T(t.name)+'"></button>');

      b.addEventListener('click',function(){tap(i);});list.appendChild(b);return b;});

          var a=el('<button type="button" class="btn primary askgo">'+U('next')+'</button>');a.addEventListener('click',function(){a.remove();advance();});

    mechDone(s,h,allFirst);var a=h.querySelector('.actions')||actions(h);a.appendChild(contBtn(T(s['continue'])||U('cont'),next));
  }
  page();

/* ---------------------------------------------------------------- CAST PORTRAITS ON QUESTIONS ----------- */
/* COURSE.cast [{name:{en,ar}, img}] (build.py, from the client's cast portraits): when a question, game or quiz item involves
   characters, a row of small round portraits with their names stands above it, so the learner sees who it is about.
   The row follows what is on screen (a deck's current card, a game's round, a quiz item); question text is never changed. */

  /* the visible text of the screen, without the row itself and without feedback */

    txt+=' '+t.nodeValue;}
  var who=[];
  cast.forEach(function(c){
    var key=castKeys(TL(c.name,LANG),LANG);if(!key)return;
    var k=key.replace(new RegExp('[^A-Za-z0-9'+AR+" '-]",'g'),'.');   // names are letters, spaces, hyphens; anything else matches any one character
    var re=ar.test(key)?new RegExp('(^|[^'+AR+'])[وفبل]?'+k+'(?!['+AR+'])'):new RegExp('(^|[^A-Za-z])'+k+'(?![A-Za-z])','i');
    var m=re.exec(txt);if(m)who.push({c:c,at:m.index});

  if(old&&old.dataset.ids===ids)return;
  if(old)old.remove();
  if(!who.length)return;
  var row=el('<div class="castrow" aria-hidden="true"></div>');row.dataset.ids=ids;   // the names are in the question already
  who.forEach(function(w){var chip=el('<span class="castchip"><img class="castpic" alt=""><b></b></span>'),img=chip.querySelector('img');
    img.src=w.c.img;img.dataset.cast=w.c.id;img.onerror=function(){chip.remove();};chip.querySelector('b').textContent=TL(w.c.name,LANG);row.appendChild(chip);});

/* ---- teaching audio is not optional (user, 2026-11-06: 'the audio should not be optional if it is teaching something') ----
   hearAll(files, done): the voice plays by itself; if the browser blocks sound, one big 'Play the voice' button shows; done() runs
   once the last line has played to the end. A file that cannot be played never blocks (done() runs). A wave shows while it plays;
   'Hear it again' replays. The audio elements live in the screen, so leaving the screen stops them. Review builds
   (COURSE.reviewFree) never wait. */
var HEAR_NOW=null;
function hearAll(files,done){
  var w=el('<div class="hear" role="group"><span class="hear-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>'+
    '<span class="hear-lab">'+U('voicePlaying')+'</span>'+
    '<button type="button" class="btn hear-play" hidden>&#9654; '+U('playVoice')+'</button>'+
    '<button type="button" class="hear-again" hidden>&#8635; '+U('hearAgain')+'</button></div>');
  var pb=w.querySelector('.hear-play'),ag=w.querySelector('.hear-again'),lab=w.querySelector('.hear-lab'),fin=false,called=false;
  function fire(){if(called)return;called=true;if(done)done();}
  var aus=files.map(function(f){var a=document.createElement('audio');a.preload='auto';a.src=f;w.appendChild(a);return a;});
  function end(){if(fin)return;fin=true;clearTimeout(w._t);w._heard=true;w.classList.remove('playing');w.classList.add('heard');pb.hidden=true;ag.hidden=false;lab.textContent=U('voiceDone');fire();}
  function play(k){if(!w.isConnected&&k>0)return;if(HEAR_NOW&&HEAR_NOW!==aus)HEAR_NOW.forEach(function(x){try{x.pause();}catch(_){}});HEAR_NOW=aus;
    aus.forEach(function(x,j){if(j!==k)try{x.pause();}catch(_){}});
    var a=aus[k];try{a.currentTime=0;}catch(_){}clearTimeout(w._t);
    /* safety net (2026-11-07, reviewer twice: Next never activated): it starts the moment the line is asked to play, so a voice that is slow
       to load, never starts, is blocked by the phone, or never reports its end cannot leave Next disabled; it fires after the line's length + 3 s (12 s + 3 s when the length is not known yet) */
    var net=function(){if(fin||a.ended)return;if(k<aus.length-1)play(k+1);else end();};
    w._t=setTimeout(net,((isFinite(a.duration)&&a.duration)||12)*1000+3000);
    var p=a.play();
    if(p&&p.then)p.then(function(){clearTimeout(w._t);w._t=setTimeout(net,((isFinite(a.duration)&&a.duration)||10)*1000+3000);},function(){});
    if(p&&p.catch)p.catch(function(){if(!fin){pb.hidden=false;lab.textContent=U('tapToHear');}});}
  aus.forEach(function(a,k){
    a.addEventListener('playing',function(){w.classList.add('playing');pb.hidden=true;if(!fin)lab.textContent=U('voicePlaying');});
    a.addEventListener('pause',function(){w.classList.remove('playing');});
    a.addEventListener('ended',function(){w.classList.remove('playing');if(k<aus.length-1)play(k+1);else end();});
    a.addEventListener('error',function(){if(k<aus.length-1)play(k+1);else end();});});
  pb.addEventListener('click',function(e){e.stopPropagation();play(0);});
  ag.addEventListener('click',function(e){e.stopPropagation();play(0);});
  w._start=function(){if(!aus.length){end();return;}play(0);if(COURSE.reviewFree)fire();};
  w._heard=false;
  if(!aus.length)w.hidden=true;
  return w;
}
